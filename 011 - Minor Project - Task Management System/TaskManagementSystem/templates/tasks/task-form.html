<!DOCTYPE html>
<html>
<head>
<title>Add Task</title>
</head>
<body>
{% if task %}
<h1>Update Task</h1>
{% else %}
<h1>Add New Task</h1>
{% endif %}
<form method="POST">
{% csrf_token %}
<div>
{{ form.title.label_tag }}
{{ form.title }}
{{ form.title.errors }}
</div>
<div>
{{ form.description.label_tag }}
{{ form.description }}
{{ form.description.errors }}
</div>
<button type="submit">
{% if task %}
Update Task
{% else %}
Add Task
{% endif %}
</button>
</form>
<a href="{% url 'task-list' %}">View Tasks</a>
</body>
</html>
